name: Regenerate Casual clothing PNGs

on:
  workflow_dispatch:
  push:
    branches:
      - assets/casual-clothing-set
    paths:
      - scripts/generate_casual_assets.py
      - .github/workflows/regenerate-casual-assets.yml

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: assets/casual-clothing-set
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install asset-generation dependencies
        run: python -m pip install --disable-pip-version-check pillow numpy

      - name: Regenerate all Casual PNG overlays
        run: python scripts/generate_casual_assets.py

      - name: Verify PNG set
        run: |
          test "$(find assets/buddy/clothing/tops/tee/classic -name '*.png' | wc -l)" -eq 8
          test "$(find assets/buddy/clothing/pants/jeans/wide-leg -name '*.png' | wc -l)" -eq 8
          test "$(find assets/buddy/clothing/shoes/sneakers/low-top -name '*.png' | wc -l)" -eq 8

      - name: Commit regenerated PNGs
        run: |
          if git diff --quiet -- assets/buddy/clothing; then
            echo "Assets are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/buddy/clothing/tops/tee/classic/*.png
          git add assets/buddy/clothing/pants/jeans/wide-leg/*.png
          git add assets/buddy/clothing/shoes/sneakers/low-top/*.png
          git commit -m "Regenerate clean Casual PNG clothing assets"
          git push origin HEAD:assets/casual-clothing-set
